<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animations in CSS -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beamScan {
        0% { transform: translateX(-1200px); }
        50% { transform: translateX(1200px); }
        100% { transform: translateX(-1200px); }
      }
      @keyframes floatPill1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatPill2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes floatPill3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatPill4 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseNode {
        0%, 100% { r: 3.5px; opacity: 0.4; }
        50% { r: 6px; opacity: 1; }
      }

      .pulse-orb {
        transform-origin: 600px 190px;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .beam-line {
        animation: beamScan 10s ease-in-out infinite;
      }
      .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
      .pill-2 { animation: floatPill2 6s ease-in-out infinite 0.7s; }
      .pill-3 { animation: floatPill3 5.5s ease-in-out infinite 1.4s; }
      .pill-4 { animation: floatPill4 6.2s ease-in-out infinite 2.1s; }
      .node-1 { animation: pulseNode 3s infinite; }
      .node-2 { animation: pulseNode 4s infinite 1s; }
      .node-3 { animation: pulseNode 3.5s infinite 2s; }
      .radar-ray {
        transform-origin: 1050px 90px;
        animation: radarSweep 14s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />

  <!-- Technical Grid Pattern Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="850" y1="0" x2="850" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1150" y1="0" x2="1150" y2="380" />
  </g>

  <!-- Dynamic Ambient Orbs (Background) -->
  <g class="pulse-orb" filter="url(#glow)">
    <circle cx="280" cy="150" r="140" fill="#38bdf8" opacity="0.16" />
    <circle cx="880" cy="200" r="160" fill="#818cf8" opacity="0.14" />
    <circle cx="600" cy="180" r="180" fill="#c084fc" opacity="0.10" />
  </g>

  <!-- Dynamic Radar Scanner Element (Upper Right Corner Background) -->
  <g opacity="0.4">
    <circle cx="1050" cy="90" r="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="1050" cy="90" r="45" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.6" />
    <circle cx="1050" cy="90" r="20" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.8" />
    <g class="radar-ray">
      <line x1="1050" y1="90" x2="1120" y2="90" stroke="url(#primary-glow)" stroke-width="2" opacity="0.8" />
      <polygon points="1050,90 1120,70 1120,90" fill="url(#primary-glow)" opacity="0.18" />
    </g>
  </g>

  <!-- Constellation Search Nodes (Background) -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.35">
    <line x1="110" y1="80" x2="220" y2="130" />
    <line x1="220" y1="130" x2="160" y2="240" />
    <line x1="160" y1="240" x2="80" y2="210" />
    <line x1="1020" y1="250" x2="1120" y2="210" />
    <line x1="1120" y1="210" x2="1080" y2="310" />
  </g>
  <circle cx="110" cy="80" r="4" fill="#38bdf8" class="node-1" />
  <circle cx="220" cy="130" r="5" fill="#818cf8" class="node-2" />
  <circle cx="160" cy="240" r="4" fill="#c084fc" class="node-3" />
  <circle cx="80" cy="210" r="3.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="1020" cy="250" r="4.5" fill="#38bdf8" class="node-2" />
  <circle cx="1120" cy="210" r="4" fill="#818cf8" class="node-1" />
  <circle cx="1080" cy="310" r="3.5" fill="#c084fc" class="node-3" />

  <!-- Scanning Laser Beam (Subtle Background Effect) -->
  <g opacity="0.25">
    <line x1="0" y1="365" x2="1200" y2="365" stroke="url(#primary-glow)" stroke-width="1.5" />
    <rect class="beam-line" x="0" y="363" width="160" height="4" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Outer Border Frame with Gradient Glow -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" opacity="0.65" />

  <!-- FOREGROUND CONTENT: Header, Typography & Clear Visual Hierarchy -->
  <!-- Category Over-Title Tag -->
  <g transform="translate(600, 68)">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1.2" filter="url(#subtle-glow)" />
    <circle cx="-112" cy="-1" r="5" fill="#38bdf8" />
    <text text-anchor="middle" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="2.5">
      CURATED ECOSYSTEM GUIDE
    </text>
  </g>

  <!-- Main Title (Guaranteed Unobscured in Foreground) -->
  <g transform="translate(600, 142)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#text-grad)" letter-spacing="-1">
      Awesome Search Engines
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 186)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Enterprise SaaS Platforms • High-Performance Open-Source Retrieval • Vector &amp; Hybrid RAG
    </text>
  </g>

  <!-- Interactive Dynamic Floating Feature Pills (Below text in clear footer area) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Sub-50ms Query Latency -->
    <g class="pill-1" transform="translate(-425, 0)">
      <rect x="0" y="0" width="195" height="42" rx="21" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16">⚡</text>
      <text x="48" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Sub-50ms Latency</text>
    </g>

    <!-- Pill 2: Typo-Tolerant Matching -->
    <g class="pill-2" transform="translate(-205, 0)">
      <rect x="0" y="0" width="195" height="42" rx="21" fill="url(#pill-grad)" stroke="#818cf8" stroke-width="1.2" />
      <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16">🔍</text>
      <text x="46" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Typo Tolerance</text>
    </g>

    <!-- Pill 3: Hybrid Lexical & Vector RAG -->
    <g class="pill-3" transform="translate(15, 0)">
      <rect x="0" y="0" width="200" height="42" rx="21" fill="url(#pill-grad)" stroke="#c084fc" stroke-width="1.2" />
      <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16">🧠</text>
      <text x="46" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Hybrid &amp; Vector RAG</text>
    </g>

    <!-- Pill 4: Open-Source & SaaS Matrix -->
    <g class="pill-4" transform="translate(240, 0)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="url(#pill-grad)" stroke="#34d399" stroke-width="1.2" />
      <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16">🌐</text>
      <text x="46" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">SaaS &amp; OSS Matrix</text>
    </g>
  </g>

  <!-- Metric Quick-Bar at Base -->
  <g transform="translate(600, 335)" opacity="0.8">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1.2">
      BM25 LEXICAL • DENSE VECTORS • INVERTED INDEX • FACETED SEARCH • RAG RETRIEVAL
    </text>
  </g>
</svg>
